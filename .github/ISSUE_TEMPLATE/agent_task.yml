name: "[Agent Task] AI Agent 작업"
description: AI Agent가 직접 수행할 작업
title: "[Agent] "
labels: ["agent-ready", "ready-for-agent"]
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: 왜 이 작업이 필요한가요?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 완료 상태 정의
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 수정해야 할 범위
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: 완료 조건
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: related_files
    attributes:
      label: Related Files
      description: 관련 파일 목록
  - type: textarea
    id: test_plan
    attributes:
      label: Test Plan
      description: 검증 방법
  - type: dropdown
    id: risk
    attributes:
      label: Risk Level
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: agent_instruction
    attributes:
      label: Agent Instruction
      description: Agent가 반드시 지켜야 할 지침
    validations:
      required: true


<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계정 생성 | Youth FC Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="fullscreen-center"><div class="login-card"><div class="text-center mb-4"><div style="width:64px;height:64px;background:#7c3aed;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;"><i class="bi bi-person-plus" style="font-size:2rem;color:white"></i></div><h4 class="fw-bold">계정 생성</h4><p class="text-muted small">초대 링크를 통해 가입할 수 있습니다</p></div><div class="alert alert-info py-2 small"><i class="bi bi-info-circle"></i> 관리자의 초대가 있어야 가입할 수 있습니다.</div><form><div class="mb-3"><label class="form-label small fw-medium text-muted">이름</label><input type="text" class="form-control" placeholder="홍길동"></div><div class="mb-3"><label class="form-label small fw-medium text-muted">이메일</label><input type="email" class="form-control" placeholder="name@example.com"></div><div class="row g-3 mb-3"><div class="col-6"><label class="form-label small fw-medium text-muted">비밀번호</label><input type="password" class="form-control" placeholder="8자 이상"></div><div class="col-6"><label class="form-label small fw-medium text-muted">비밀번호 확인</label><input type="password" class="form-control" placeholder="다시 입력"></div></div><div class="mb-3"><label class="form-label small fw-medium text-muted">초대 코드</label><input type="text" class="form-control" placeholder="초대 링크의 코드를 입력하세요"></div><div class="mb-4"><label class="form-label small fw-medium text-muted">가입 유형</label><div class="d-flex gap-3"><div class="form-check"><input type="radio" name="role" checked><label class="form-check-label">학부모</label></div><div class="form-check"><input type="radio" name="role"><label class="form-check-label">코치</label></div></div></div><button type="submit" class="btn btn-primary btn-lg w-100 mb-3">계정 생성</button><div class="text-center"><span class="small text-muted">이미 계정이 있으신가요?</span> <a href="login.html" class="small text-primary text-decoration-none fw-medium">로그인</a></div></form></div></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>

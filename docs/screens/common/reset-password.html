  <div class="fullscreen-center"><div class="login-card"><div class="text-center mb-4"><div style="width:64px;height:64px;background:#059669;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;"><i class="bi bi-key" style="font-size:2rem;color:white"></i></div><h4 class="fw-bold">비밀번호 재설정</h4><p class="text-muted small">가입한 이메일을 입력하시면 인증 링크를 보내드립니다</p></div><form><div class="mb-4"><label class="form-label small fw-medium text-muted">이메일</label><input type="email" class="form-control form-control-lg" placeholder="name@example.com"></div><button type="submit" class="btn btn-success btn-lg w-100 mb-3">인증 메일 보내기</button><div class="text-center"><a href="login.html" class="small text-primary text-decoration-none"><i class="bi bi-arrow-left"></i> 로그인으로 돌아가기</a></div></form><div class="mt-4 p-3 bg-light rounded-3"><h6 class="small fw-bold mb-2"><i class="bi bi-info-circle"></i> 인증 절차</h6><ol class="small text-muted mb-0 ps-3"><li>이메일 주소 입력</li><li>인증 메일 수신 (1~2분 소요)</li><li>메일 내 링크 클릭</li><li>새 비밀번호 설정 완료</li></ol></div></div></div>
